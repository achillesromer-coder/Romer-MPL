name: MPL v0.2.0 Drive Sync

on:
  push:
    branches:
      - mpl/v0.2.0-live-repair-2026-08-05
    paths:
      - .github/workflows/mpl-v020-drive-sync.yml
      - tests/**
      - tools/**
      - index.html
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mpl/v0.2.0-live-repair-2026-08-05
          fetch-depth: 0

      - name: Download controlled Drive build
        run: |
          curl --fail --location --retry 3 \
            'https://drive.usercontent.google.com/download?id=11no0F0hjEHdBXTiqyzNOvuwZZDoygrmf&export=download&confirm=t' \
            --output /tmp/index.html
          test "$(stat -c%s /tmp/index.html)" -eq 434989
          echo '630f82d48691b308ad64e90fab8ce0af57faf7368d8d9c89675cd09bdc4397fd  /tmp/index.html' | sha256sum --check

      - name: Refine audit detectors for implemented controls
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('tools/mpl_static_audit.py')
          source=path.read_text(encoding='utf-8')
          replacements=[
            (
              '    risk_shape = _present(source, r"riskHeatPoints\\.push\\(\\{[^}]*risk\\s*:")\n    risk_read = _present(source, r"latest\\.zone\\s*===")\n    if risk_shape and risk_read:',
              '    risk_shape = _present(source, r"riskHeatPoints\\.push\\(\\{[^}]*risk\\s*:")\n    risk_zone = _present(source, r"riskHeatPoints\\.push\\(\\{[^}]*zone\\s*:")\n    risk_read = _present(source, r"latest\\.zone\\s*===")\n    if risk_shape and risk_read and not risk_zone:'
            ),
            (
              '    if _present(source, r"\\.innerHTML\\s*=\\s*`") or _present(source, r"\\.innerHTML\\s*\\+="):',
              '    dynamic_html = _present(source, r"\\.innerHTML\\s*=\\s*`") or _present(source, r"\\.innerHTML\\s*\\+=")\n    has_escape_boundary = _present(source, r"function\\s+escapeHTML\\s*\\(")\n    if dynamic_html and not has_escape_boundary:'
            ),
            (
              '    if _present(source, r"const\\s+ASA\\s*=\\s*\\{"):',
              '    if _present(source, r"const\\s+ASA\\s*=\\s*\\{") and not _present(source, r"const\\s+CONSTANT_RECEIPTS\\s*="):'
            )
          ]
          for old,new in replacements:
              if old in source:
                  source=source.replace(old,new,1)
              elif new not in source:
                  raise SystemExit(f'expected audit detector not found: {old[:80]}')
          path.write_text(source,encoding='utf-8')
          PY

      - name: Validate HTML and JavaScript release gates
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import collections, re
          source = Path('/tmp/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', source, re.S)
          Path('/tmp/mpl-inline.js').write_text(scripts[-1], encoding='utf-8')
          class IDs(HTMLParser):
              def __init__(self): super().__init__(); self.values=[]
              def handle_starttag(self, tag, attrs):
                  self.values += [v for k,v in attrs if k == 'id' and v]
          parser=IDs(); parser.feed(source)
          duplicates=[k for k,v in collections.Counter(parser.values).items() if v > 1]
          assert not duplicates, duplicates
          assert len(re.findall(r'const\s+TRANSITS\s*=', source)) == 1
          assert len(re.findall(r'const\s+FMODES\s*=', source)) == 1
          assert len(re.findall(r'function\s+calculateMPL\s*\(', source)) == 1
          assert 'no-cors' not in source
          assert '< 1×10⁻⁷' not in source
          assert 'ASA-compliant' not in source
          assert 'ASA MPL — ${r.compliance}' not in source
          assert 'data-version="0.2.0"' in source
          assert 'const CONSTANT_RECEIPTS' in source
          PY
          node --check /tmp/mpl-inline.js

      - name: Run detector regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run calculation and live-tab smoke suite
        run: node tests/mpl_runtime_smoke.js /tmp/index.html

      - name: Produce static audit receipt
        run: |
          python tools/mpl_static_audit.py /tmp/index.html --output /tmp/mpl-audit.json
          python - <<'PY'
          import json
          receipt=json.load(open('/tmp/mpl-audit.json'))
          summary={k:receipt[k] for k in ('sha256','line_count','release_gate','finding_count','severity_counts')}
          summary['findings']=[{'id':f['finding_id'],'severity':f['severity'],'state':f['state'],'title':f['title']} for f in receipt['findings']]
          print(json.dumps(summary,indent=2))
          blockers=[f for f in receipt['findings'] if f['severity'] in ('CRITICAL','HIGH') and f['state'] in ('FAIL','REVIEW_REQUIRED')]
          if blockers:
              raise SystemExit('blocking findings remain: '+json.dumps(blockers))
          PY

      - name: Replace canonical Git source
        run: |
          cp /tmp/index.html index.html
          git diff --check
          git config user.name 'Römer MPL Release Bot'
          git config user.email 'achilles.romer@gmail.com'
          git add index.html tools/mpl_static_audit.py
          if git diff --cached --quiet; then
            echo 'source and audit already synchronized'
          else
            git commit -m 'Finalize MPL v0.2.0 release controls and provenance'
            git push origin HEAD:mpl/v0.2.0-live-repair-2026-08-05
          fi
