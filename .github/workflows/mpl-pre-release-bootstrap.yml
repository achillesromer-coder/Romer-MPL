name: MPL Pre-release Candidate Bootstrap

on:
  push:
    branches:
      - mpl/pre-release-hardening-2026-08-08
    paths:
      - .github/workflows/mpl-pre-release-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronise-candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mpl/pre-release-hardening-2026-08-08
          fetch-depth: 0
      - name: Retrieve exact controlled candidate bytes
        run: |
          curl --fail --location --retry 3 \
            'https://drive.usercontent.google.com/download?id=16o28fO4MQjRbmYeYYC5IWvtPbXyHi0WT&export=download&confirm=t' \
            --output /tmp/index.html
          test "$(stat -c%s /tmp/index.html)" -eq 426681
          echo '777be3d091c4bcf1063c02568baabe766f45f51e6486891238bd9df8e7fb3d8c  /tmp/index.html' | sha256sum --check
      - name: Replace branch executable source
        run: |
          cp /tmp/index.html index.html
          git diff --check
          git config user.name 'Römer MPL Pre-release Bot'
          git config user.email 'achilles.romer@gmail.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Candidate source already synchronized'
          else
            git commit -m 'Harden MPL pre-release engine and controlled data path'
            git push origin HEAD:mpl/pre-release-hardening-2026-08-08
          fi
