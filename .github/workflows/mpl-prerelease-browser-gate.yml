name: MPL Pre-release Browser Acceptance

on:
  push:
    branches: [mpl/pre-release-hardening-2026-08-09]
    paths-ignore:
      - docs/MPL_BROWSER_GATE_LATEST.json
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser-acceptance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mpl/pre-release-hardening-2026-08-09
          fetch-depth: 0

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start candidate server
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/mpl-http.log 2>&1 &
          echo $! > /tmp/mpl-http.pid
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep .25; done
          cat /tmp/mpl-http.log
          exit 1

      - name: Run comprehensive browser acceptance probe
        id: browser
        continue-on-error: true
        env:
          CANDIDATE_URL: http://127.0.0.1:4173/index.html
        run: node tests/browser_globe_probe.mjs

      - name: Verify workbook write-receipt control in Chromium
        id: write_receipt
        continue-on-error: true
        env:
          CANDIDATE_URL: http://127.0.0.1:4173/index.html
        run: |
          node tests/browser_write_receipt_probe.mjs | tee /tmp/write-receipt.log
          mkdir -p artifacts/browser-globe
          cp /tmp/write-receipt.log artifacts/browser-globe/workbook-write-receipt.log

      - name: Archive exact candidate and browser receipts
        if: always()
        run: |
          mkdir -p artifacts/browser-globe
          cp index.html artifacts/browser-globe/candidate-index.html
          sha256sum index.html | tee artifacts/browser-globe/candidate-index.sha256

      - name: Persist compact browser gate receipt
        if: always()
        env:
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          WRITE_OUTCOME: ${{ steps.write_receipt.outcome }}
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          source=Path('index.html').read_bytes()
          summary_path=Path('artifacts/browser-globe/summary.json')
          rows=json.loads(summary_path.read_text()) if summary_path.exists() else []
          candidate=[r for r in rows if r.get('target',{}).get('name','').startswith('candidate-')]
          passed=os.environ.get('BROWSER_OUTCOME')=='success' and os.environ.get('WRITE_OUTCOME')=='success'
          receipt={
            'schema':'romer.mpl.browser_gate/1',
            'stage':'PRE_RELEASE',
            'status':'PASS' if passed else 'FAIL',
            'candidateSha256':hashlib.sha256(source).hexdigest(),
            'workbookWriteReceipt':os.environ.get('WRITE_OUTCOME'),
            'targets':[]
          }
          for r in candidate:
            d=r.get('diagnostic') or {}; ex=r.get('exercise') or {}
            receipt['targets'].append({
              'name':r.get('target',{}).get('name'),
              'exerciseError':r.get('exerciseError'),
              'pageErrors':r.get('pageErrors',[]),
              'canvas':d.get('canvas'),
              'webgl':d.get('glState'),
              'state':d.get('state'),
              'checks':ex.get('checks',[])
            })
          Path('docs/MPL_BROWSER_GATE_LATEST.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
          git config user.name 'Römer MPL Browser Gate'
          git config user.email 'achilles.romer@gmail.com'
          git add docs/MPL_BROWSER_GATE_LATEST.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record latest MPL browser acceptance receipt'
            git push origin HEAD:mpl/pre-release-hardening-2026-08-09
          fi

      - name: Upload browser receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpl-pre-release-browser-${{ github.sha }}
          path: artifacts/browser-globe
          if-no-files-found: error
          retention-days: 30

      - name: Enforce browser acceptance gate
        if: steps.browser.outcome != 'success' || steps.write_receipt.outcome != 'success'
        run: |
          echo 'MPL pre-release browser acceptance failed.' >&2
          cat artifacts/browser-globe/summary.json || true
          cat artifacts/browser-globe/workbook-write-receipt.log || true
          exit 1
