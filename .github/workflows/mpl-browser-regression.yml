name: MPL Browser Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start candidate server
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/mpl-http.log 2>&1 &
          echo $! > /tmp/mpl-http.pid
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep .25; done
          cat /tmp/mpl-http.log
          exit 1
      - name: Probe desktop and mobile execution paths
        env:
          CANDIDATE_URL: http://127.0.0.1:4173/index.html
        run: node tests/browser_globe_probe.mjs
      - name: Probe 1 km near-surface fidelity and controlled fallback
        env:
          CANDIDATE_URL: http://127.0.0.1:4173/index.html
        run: node tests/near_surface_lod_probe.mjs
      - name: Archive exact tested source and browser receipts
        if: always()
        run: |
          mkdir -p artifacts/browser-mpl
          cp index.html artifacts/browser-mpl/tested-index.html
          sha256sum index.html | tee artifacts/browser-mpl/tested-index.sha256
      - name: Upload browser receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpl-browser-regression-${{ github.sha }}
          path: artifacts/browser-mpl
          if-no-files-found: error
          retention-days: 30
