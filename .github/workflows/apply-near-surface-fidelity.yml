name: Apply Near-surface Fidelity

on:
  push:
    branches: [mpl/near-surface-fidelity]
    paths:
      - tools/apply_near_surface_fidelity.py
      - .github/workflows/apply-near-surface-fidelity.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mpl/near-surface-fidelity
      - name: Apply deterministic source transform
        run: python tools/apply_near_surface_fidelity.py
      - name: Validate inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          Path('/tmp/mpl-inline.js').write_text('\n'.join(re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S)))
          PY
          node --check /tmp/mpl-inline.js
      - name: Commit transformed executable
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Harden near-surface globe fidelity and NASA GIBS LOD'
          git push origin HEAD:mpl/near-surface-fidelity
