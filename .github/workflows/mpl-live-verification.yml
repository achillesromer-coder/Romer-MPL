name: MPL Live Verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mpl-live-verification.yml
      - index.html
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect public route and embedded application targets
        run: |
          python - <<'PY'
          import hashlib, html, json, re, ssl, urllib.parse, urllib.request
          from html.parser import HTMLParser

          ROUTE='https://romer.industries/mpl-engine'
          EXPECTED_VERSION='v0.2.0'
          EXPECTED_DRIVE_ID='11no0F0hjEHdBXTiqyzNOvuwZZDoygrmf'
          EXPECTED_GIT_BLOB='1f5646bc701d9b275c8768ff78a440b7b8fb8ab5'
          HEADERS={'User-Agent':'Romer-MPL-Live-Verifier/0.2.0','Accept':'text/html,application/xhtml+xml,*/*'}
          context=ssl.create_default_context()

          def fetch(url):
              request=urllib.request.Request(url,headers=HEADERS)
              with urllib.request.urlopen(request,context=context,timeout=30) as response:
                  raw=response.read()
                  return {
                      'requested_url':url,
                      'final_url':response.geturl(),
                      'status':response.status,
                      'content_type':response.headers.get('content-type',''),
                      'bytes':len(raw),
                      'sha256':hashlib.sha256(raw).hexdigest(),
                      'text':raw.decode('utf-8','replace')
                  }

          class Targets(HTMLParser):
              def __init__(self):
                  super().__init__(); self.targets=[]; self.title=[]; self.in_title=False
              def handle_starttag(self,tag,attrs):
                  attrs=dict(attrs)
                  if tag=='title': self.in_title=True
                  for key in ('src','href','data'):
                      value=attrs.get(key)
                      if value and tag in ('iframe','embed','object','script','a'):
                          self.targets.append({'tag':tag,'attribute':key,'value':html.unescape(value)})
              def handle_endtag(self,tag):
                  if tag=='title': self.in_title=False
              def handle_data(self,data):
                  if self.in_title: self.title.append(data)

          root=fetch(ROUTE)
          parser=Targets(); parser.feed(root['text'])
          candidates=[]
          for target in parser.targets:
              url=urllib.parse.urljoin(root['final_url'],target['value'])
              host=urllib.parse.urlparse(url).hostname or ''
              if target['tag'] in ('iframe','embed','object') or any(x in host for x in ('github','googleusercontent','drive.google','script.google','pages.dev','vercel','netlify')):
                  candidates.append({'tag':target['tag'],'url':url})
          unique=[]; seen=set()
          for candidate in candidates:
              if candidate['url'] not in seen:
                  seen.add(candidate['url']); unique.append(candidate)

          inspected=[]
          for candidate in unique[:12]:
              try:
                  result=fetch(candidate['url'])
                  inspected.append({
                      'source':candidate,
                      'final_url':result['final_url'],
                      'status':result['status'],
                      'content_type':result['content_type'],
                      'bytes':result['bytes'],
                      'sha256':result['sha256'],
                      'has_v020':EXPECTED_VERSION in result['text'],
                      'has_new_drive_id':EXPECTED_DRIVE_ID in result['text'],
                      'has_old_drive_id':'1eWP16jI2UiauRjGyHIqs4qCiBJzEF3Wu' in result['text'],
                      'has_repo_name':'Romer-MPL' in result['text'],
                      'title':re.search(r'<title[^>]*>(.*?)</title>',result['text'],re.I|re.S).group(1).strip() if re.search(r'<title[^>]*>(.*?)</title>',result['text'],re.I|re.S) else None
                  })
              except Exception as exc:
                  inspected.append({'source':candidate,'error':f'{type(exc).__name__}: {exc}'})

          root_markers={
              'has_v020':EXPECTED_VERSION in root['text'],
              'has_new_drive_id':EXPECTED_DRIVE_ID in root['text'],
              'has_old_drive_id':'1eWP16jI2UiauRjGyHIqs4qCiBJzEF3Wu' in root['text'],
              'has_repo_name':'Romer-MPL' in root['text'],
              'has_mpl_title':'Römer MPL Platform' in root['text']
          }
          deployed=root_markers['has_v020'] or any(item.get('has_v020') for item in inspected)
          receipt={
              'route':ROUTE,
              'expected':{'version':EXPECTED_VERSION,'drive_file_id':EXPECTED_DRIVE_ID,'git_blob':EXPECTED_GIT_BLOB},
              'root':{k:v for k,v in root.items() if k!='text'},
              'root_title':' '.join(parser.title).strip(),
              'root_markers':root_markers,
              'candidate_count':len(unique),
              'inspected_targets':inspected,
              'deployed_v020_detected':deployed
          }
          print(json.dumps(receipt,indent=2,ensure_ascii=False))
          if root['status'] != 200:
              raise SystemExit(f'live route returned {root["status"]}')
          PY
