name: Apply MPL Globe Runtime Repair

on:
  pull_request:
    branches: [main]
    paths:
      - tools/repair_globe_runtime_20260807.py
      - tools/repair_mobile_presentation_20260807.py
      - .github/workflows/mpl-apply-globe-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mpl/globe-runtime-repair-2026-08-07
          fetch-depth: 0

      - name: Apply deterministic migrations
        run: |
          python tools/repair_globe_runtime_20260807.py
          python tools/repair_mobile_presentation_20260807.py
          python - <<'PY'
          from pathlib import Path
          source=Path('index.html').read_text(encoding='utf-8')
          panel_close=source.index('</div><!-- /#panel -->')
          globe=source.index('<div class="globe-wrap" id="globe-wrap">')
          tele=source.index('<div class="telebar">')
          main_close=source.rfind('</div>',0,tele)
          assert panel_close < globe < main_close < tele, (panel_close,globe,main_close,tele)
          assert 'function buildGDPHaloOverlay()' in source
          assert 'return buildGDPHaloOverlay();' in source
          assert 'const _baseGDPOverlay = buildGDPOverlay' not in source
          assert 'PROCEDURAL CLOUD LAYER' in source
          assert 'topojson-client@3.1.0/dist/topojson-client.min.js' in source
          assert '.globe-wrap { position:relative; flex:1 1 auto;' in source
          assert 'MPL RESPONSIVE GLOBE HOTFIX — 2026-08-07' in source
          assert "matchMedia?.('(max-width:760px)')" in source
          PY

      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          src=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',src,re.S)
          Path('/tmp/mpl-inline.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/mpl-inline.js
          git diff --check

      - name: Commit repaired runtime
        run: |
          git config user.name 'Römer MPL Runtime Repair'
          git config user.email 'achilles.romer@gmail.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Runtime repair already applied.'
          else
            git commit -m 'Harden responsive globe presentation'
            git push origin HEAD:mpl/globe-runtime-repair-2026-08-07
          fi
